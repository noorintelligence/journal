<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} | Noor Intelligence</title>

  <!-- Clean Base64 Gold "N" Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1117'/><text y='70' x='20' font-size='70' font-family='sans-serif' font-weight='bold' fill='%23d4af37'>N</text></svg>">

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent-gold: #d4af37;
      --accent-blue: #58a6ff;
      --code-bg: #1f242c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 20px 0;
    }

    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 a {
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--text-bright);
    }

    h1, h2, h3, h4 {
      color: var(--text-bright);
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }

    p { margin-bottom: 1.2em; }

    a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 30px 0;
    }

    ul, ol {
      margin-bottom: 1.2em;
      padding-left: 20px;
    }

    li { margin-bottom: 0.4em; }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      background-color: var(--code-bg);
      color: var(--accent-gold);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
    }

    pre code {
      display: block;
      padding: 15px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
    }

    .post-meta {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .post-card:hover {
      border-color: var(--accent-gold);
    }

    .post-card h2 {
      margin-top: 0;
      font-size: 1.25rem;
    }

    footer {
      border-top: 1px solid var(--border-color);
      margin-top: 50px;
      padding-top: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="{{ site.baseurl }}/">NOOR INTELLIGENCE</a></h1>
      <nav>
        <a href="{{ site.baseurl }}/">Field Notes</a>
        <a href="https://noorintelligence.tech/" target="_blank">Main Site ↗</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>© {{ 'now' | date: "%Y" }} Noor Intelligence · <a href="https://noorintelligence.tech/">noorintelligence.tech</a></p>
    </footer>
  </div>
</body>
</html>
